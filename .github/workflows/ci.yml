name: ROM-free CI
on:
  push:
    branches: [feat/release-distribution]
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ python3 git
      - name: Bootstrap pinned runtime headers and patches
        run: python3 scripts/bootstrap.py --only runtime
      - name: Configure ROM-free targets
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DSBK_ROM_FREE_CI=ON
      - name: Build
        run: cmake --build build-ci
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
      - name: Diff check
        run: git diff --check
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure ROM-free targets
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -DSBK_ROM_FREE_CI=ON
      - name: Build
        run: cmake --build build-ci --config Release
      - name: ROM-free tests supported on Windows
        run: ctest --test-dir build-ci -C Release -R "compat_audio_progress|release_artifact_audit" --output-on-failure
      - name: Diff check
        run: git diff --check
