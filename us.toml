# Initial N64Recomp configuration for Snowboard Kids (USA).
#
# This intentionally starts from the matching ELF produced by:
#   cdlewis/snowboardkids-decomp
#
# Paths are relative to this file. With the recommended workspace:
#
#   ~/proyectos/Recomp/
#   ├── SnowboardKids-Recomp/
#   ├── snowboardkids-decomp/
#   └── snowboardkids.z64
#
# the ELF path below points at the verified matching build.

[input]
entrypoint = 0x80000400
elf_path = "../snowboardkids-decomp/build/snowboardkids.elf"
output_func_path = "RecompiledFuncs"

# Static callback used by sprintf/_Printf. The matching ELF does not expose
# this local function to N64Recomp's runtime section table, but the original
# game passes its address indirectly. Register it explicitly so
# get_function(0x800A3500) can resolve it when race/menu text is formatted.
manual_funcs = [
    { name = "sprintf_text_0000", section = ".main", vram = 0x800A3500, size = 0x24 },
]

[patches]
stubs = []
ignored = [
    # RSP microcode is not CPU code. These blocks are handled separately by
    # RSPRecomp/runtime integration.
    "aspMainTextStart",
    "gspF3DLX_fifoTextStart",
]
renamed = [
    # Snowboard Kids has an N64 function literally named "main". Clang treats
    # that identifier specially in hosted C and rejects its recomp signature.
    # N64Recomp appends "_recomp" consistently to declarations and callsites.
    "main",
]
