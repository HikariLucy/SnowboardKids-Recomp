name: ROM-free CI
on:
  push:
    branches: [main, release/v0.9.0-beta, feat/release-distribution, feat/split-game-module, feat/vsync-presentation, feat/windows-release]
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ python3 git
      - name: Bootstrap pinned runtime, theme fonts and patches
        run: python3 scripts/bootstrap.py --only runtime --only theme
      - name: Configure ROM-free targets
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DSBK_ROM_FREE_CI=ON
      - name: Build
        run: cmake --build build-ci
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
      - name: Controller Pak suite under ASan/UBSan
        run: |
          # GCC 13 ASan cannot map shadow memory with the runner's 32-bit mmap entropy.
          sudo sysctl vm.mmap_rnd_bits=28
          python3 tests/controller_pak/run.py --sanitize address,undefined
      - name: Diff check
        run: git diff --check
  windows:
    runs-on: windows-2022
    steps:
      # The canonical patch checker compares bytes with upstream Git blobs.
      - name: Keep LF checkouts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned runtime, theme fonts and patches
        run: python scripts/bootstrap.py --only runtime --only theme
      - name: Configure ROM-free targets
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -DSBK_ROM_FREE_CI=ON
      - name: Build
        run: cmake --build build-ci --config Release
      - name: ROM-free tests
        run: ctest --test-dir build-ci -C Release --output-on-failure -V
      - name: Controller Pak toolchain proof
        shell: pwsh
        run: |
          $id = & build-ci/Release/SnowboardKidsControllerPakTest.exe --compiler
          "Controller Pak test built by: $id"
          if ($id -notmatch '^(MSVC|ClangCl) ') { throw "expected MSVC or clang-cl, got: $id" }
      - name: Diff check
        run: git diff --check
